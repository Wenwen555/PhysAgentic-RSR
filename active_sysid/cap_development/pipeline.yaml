version: 1
coding_agent:
  provider: codex_cli
  model: gpt-6-astra
  reasoning_effort: high
  invoke: manual_only
  revisions_per_stage: 3
runtime:
  simulator: robot_m2
  entrypoint: run(api)
  allowed_cameras: [overview, robot0_eye_in_hand]
  task_goal_door_angle_rad: 0.30
  stage_order: [privileged_exact, visual_exact, visual_randomized]
stages:
  privileged_exact:
    observations: privileged
    development_seeds: [0]
    output_policy: policies/robot_space/cap_stage1_privileged.py
    predecessor: null
  visual_exact:
    observations: visual
    development_seeds: [0]
    output_policy: policies/robot_space/cap_stage2_visual.py
    predecessor: privileged_exact
  visual_randomized:
    observations: visual
    development_seeds: [12001, 12002, 12003, 12004, 12005, 12006, 12007, 12008, 12009, 12010, 12011, 12012, 12013, 12014, 12015, 12016, 12017, 12018, 12019, 12020]
    acceptance_seeds: [91201, 91202, 91203, 91204, 91205, 91206, 91207, 91208, 91209, 91210, 91211, 91212, 91213, 91214, 91215, 91216, 91217, 91218, 91219, 91220, 91221, 91222, 91223, 91224, 91225, 91226, 91227, 91228, 91229, 91230]
    output_policy: policies/robot_space/cap_stage3_robust.py
    predecessor: visual_exact
