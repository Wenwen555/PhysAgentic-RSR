stage: visual_randomized
world: reference_world
mechanism: lever
observations: visual
visual_cameras: [overview, robot0_eye_in_hand]
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
max_steps: 30000
goal_angle_rad: 0.30
# Uniform multipliers on nominal source-World physical and visual parameters.
# Drawn once per episode, applied to the *in-memory* MuJoCo model only.
randomization:
  door_damping: [0.70, 1.30]
  door_frictionloss: [0.70, 1.30]
  handle_damping: [0.70, 1.30]
  handle_stiffness: [0.70, 1.30]
  handle_contact_friction: [0.75, 1.25]
  illumination: [0.80, 1.20]
