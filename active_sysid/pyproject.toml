[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "active-sysid"
version = "0.1.0"
description = "Task-Driven Active Physical System Identification for Interactive Simulation Reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
opt = ["cma>=3"]          # CMA-ES 参数拟合
sim = ["mujoco>=3.2.7"]   # MJCF 编辑 + rollout 验证
plot = ["matplotlib>=3.7"]  # 基线/实验曲线图
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
